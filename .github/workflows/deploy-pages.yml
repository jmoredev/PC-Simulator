name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Única fuente de la base del sitio de proyecto: la usa la build (Vite) y
  # también la comprobación de abajo; si hay que tocarla, se toca solo aquí.
  BASE_PATH: /PC-Simulator/

permissions:
  contents: read
# Serializa los runs del mismo ref (los push a `main`), no los de los PR:
# dos push seguidos no pueden desplegarse en desorden.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Un pull request solo compila: publicar lo hace únicamente `main`.
      - run: npm run build
      # La base llega a la build o se ve en rojo: el patrón va anclado a `="` y
      # hay un chequeo explícito de que BASE_PATH no esté vacía, para que una
      # variable mal escrita no pueda pasar por accidente con `grep /assets/`.
      - name: Comprobar que la base de Pages llega a la build
        run: |
          test -n "${BASE_PATH}" || { echo "::error::Falta BASE_PATH en el workflow."; exit 1; }
          grep -Fq "=\"${BASE_PATH}assets/" dist/index.html || {
            echo "::error::La build no lleva la base ${BASE_PATH}: revisa BASE_PATH."
            exit 1
          }
      # Sin `actions/configure-pages`: no usamos ninguna de sus salidas y exige
      # que Pages ya esté activado, lo que ponía en rojo la build de los PR.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Solo publica un push a `main`, o un «Run workflow» lanzado sobre `main`:
    # ni los pull requests ni una ejecución manual sobre otra rama llegan aquí.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
